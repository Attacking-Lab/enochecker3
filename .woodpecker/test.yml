matrix:
  PYTHON_VERSION:
    - "3.10"
    - "3.11"
    - "3.12"
    - "3.13"
    - "3.14"

when:
  - event: [push, manual]

services:
  - name: mongo
    image: mongo

steps:
  - name: test
    image: python:${PYTHON_VERSION}
    environment:
      MONGO_HOST: mongo
      TEST_FLAGS: --with_mongodb
    commands:
      - pip install uv==0.8.5 rust-just
      - export UV_FLAGS="--exact --isolated --frozen"
      - just -v format
      - just -v lint
      - just -v mypy
      - just -v ty
      - just -v test
      - just -v build
      - pip install dist/enochecker3-*.tar.gz
