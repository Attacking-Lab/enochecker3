# enochecker-core is a private git dependency (see pyproject.toml's
# [tool.uv.sources], pinned at git.atklab.cloud/atklab/enochecker-core),
# so resolving it needs credentials. Rather than repeating a
# `git config --global` credential dance in every step (as
# atklab/enochecker-exploit's ci.yaml does, since Woodpecker steps don't
# share $HOME with each other), the `sync` step below authenticates just
# the one `uv sync` invocation that actually touches the git remote,
# using git-pass-helper's `git-pass` wrapper and a checker_pull_token
# secret. Woodpecker *does* share the workspace (including the .venv
# `just sync` builds there) across a pipeline's steps, so every other
# step below just reuses that already-synced --frozen venv and needs no
# credentials of its own.
#
# format/lint/mypy/ty/test/build all depend only on `sync`, not on each
# other, so Woodpecker runs them concurrently via its depends_on DAG
# mode -- same split-into-parallel-steps structure as
# atklab/enochecker-exploit's ci.yaml, adapted to this repo's existing
# per-Python-version matrix (kept here since testing the full
# requires-python range matters for a library, unlike enochecker-exploit
# which dropped its matrix to avoid multiplying image builds).
#
# The image itself (.woodpecker/Dockerfile) doesn't bake in a specific
# Python version -- it just carries uv, and every step below sets
# UV_PYTHON to the matrix's PYTHON_VERSION, so `uv sync` and friends
# provision (downloading if needed) and use that interpreter. That
# means one image tag (`latest`) serves every matrix value, built and
# pushed by a separate, non-matrixed workflow, .woodpecker/ci-image.yml
# -- see that file for why it's split out. This workflow declares a
# workflow-level `depends_on: [ci-image]` (optional: true, so it still
# runs unmodified when ci-image.yml is skipped because the Dockerfile
# didn't change) instead of an in-file step dependency, and every
# image-consuming step below sets `pull: true` so a run that *did*
# rebuild the image picks up the fresh tag instead of a stale cached
# copy.

matrix:
  PYTHON_VERSION:
    - "3.10"
    - "3.11"
    - "3.12"
    - "3.13"
    - "3.14"

when:
  - event: [push, manual]

depends_on:
  - name: ci-image
    optional: true

services:
  - name: mongo
    image: mongo

steps:
  - name: sync
    image: oci.atklab.cloud/enochecker3/enochecker3-ci:latest
    pull: true
    environment:
      UV_FLAGS: "--exact --no-config --frozen"
      UV_PYTHON: "${PYTHON_VERSION}"
      CHECKER_PULL_TOKEN:
        fromSecret: CHECKER_PULL_TOKEN
    commands:
      - git-pass -u x -p "${CHECKER_PULL_TOKEN}" -U https://git.atklab.cloud -- just -v sync

  - name: format
    image: oci.atklab.cloud/enochecker3/enochecker3-ci:latest
    pull: true
    environment:
      UV_FLAGS: "--exact --no-config --frozen"
      UV_PYTHON: "${PYTHON_VERSION}"
    depends_on:
      - name: sync
    commands:
      - just -v format

  - name: lint
    image: oci.atklab.cloud/enochecker3/enochecker3-ci:latest
    pull: true
    environment:
      UV_FLAGS: "--exact --no-config --frozen"
      UV_PYTHON: "${PYTHON_VERSION}"
    depends_on:
      - name: sync
    commands:
      - just -v lint

  - name: mypy
    image: oci.atklab.cloud/enochecker3/enochecker3-ci:latest
    pull: true
    environment:
      UV_FLAGS: "--exact --no-config --frozen"
      UV_PYTHON: "${PYTHON_VERSION}"
    depends_on:
      - name: sync
    commands:
      - just -v mypy

  - name: ty
    image: oci.atklab.cloud/enochecker3/enochecker3-ci:latest
    pull: true
    environment:
      UV_FLAGS: "--exact --no-config --frozen"
      UV_PYTHON: "${PYTHON_VERSION}"
    depends_on:
      - name: sync
    commands:
      - just -v ty

  - name: test
    image: oci.atklab.cloud/enochecker3/enochecker3-ci:latest
    pull: true
    environment:
      UV_FLAGS: "--exact --no-config --frozen"
      UV_PYTHON: "${PYTHON_VERSION}"
      MONGO_HOST: mongo
      TEST_FLAGS: --with_mongodb
    depends_on:
      - name: sync
    commands:
      - just -v test

  - name: build
    image: oci.atklab.cloud/enochecker3/enochecker3-ci:latest
    pull: true
    environment:
      UV_FLAGS: "--exact --no-config --frozen"
      UV_PYTHON: "${PYTHON_VERSION}"
    depends_on:
      - name: sync
    commands:
      - just -v build
      - pip install dist/enochecker3-*.tar.gz
