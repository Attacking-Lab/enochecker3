# Builds and pushes .woodpecker/Dockerfile -- one tag per Python version
# test.yml's matrix needs. This used to be a step *inside* test.yml's own
# matrixed workflow, which meant Woodpecker ran it once per PYTHON_VERSION
# matrix value: five independent docker:dind builds any time this
# Dockerfile changed, each redoing the same dockerd startup and
# apt-get/uv/just/git-pass-helper install work, and racing their pushes
# against each other. Splitting it into its own non-matrixed workflow
# means it builds every tag from a single dockerd, once per CI run.
#
# test.yml declares a workflow-level `depends_on: [ci-image]` (optional:
# true, so test.yml still runs when this workflow is skipped) instead of
# an in-file step dependency, and pulls this image with `pull: true` so a
# run that *did* rebuild it picks up the fresh tag instead of a stale
# cached copy. Woodpecker only shares the workspace across a *workflow's
# own* steps, not across separate workflow files, but that's fine here:
# the only thing this workflow hands to test.yml is the pushed image, via
# the registry, not the local filesystem.
#
# PYTHON_VERSIONS below must be kept in sync by hand with test.yml's
# matrix.PYTHON_VERSION list -- Woodpecker doesn't share matrix values
# across separate workflow files.
#
# This agent runs steps under the sysbox runtime, which lets a plain,
# unprivileged `docker:dind` step run its own nested dockerd safely --
# no `privileged: true` and no "trusted repo" project setting needed.
# `dockerd-entrypoint.sh` is started in the background by hand, since
# Woodpecker replaces the image's own entrypoint with the step's
# `commands:`, then the following commands wait for the daemon socket
# before touching it.
#
# Pushing to oci.atklab.cloud authenticates via oci.atklab.cloud being
# registered as a registry in this repo's Woodpecker project settings
# (provisioned out of band) rather than a secrets-driven `docker login`
# here.

when:
  - event: [push, manual]
    path: .woodpecker/Dockerfile

steps:
  - name: ci-image
    image: docker:dind
    commands:
      - dockerd-entrypoint.sh &
      - timeout 30 sh -c 'until docker info >/dev/null 2>&1; do sleep 1; done'
      - |
        for PYTHON_VERSION in 3.10 3.11 3.12 3.13 3.14; do
          docker build -f .woodpecker/Dockerfile --build-arg PYTHON_VERSION=${PYTHON_VERSION} -t oci.atklab.cloud/enochecker3/enochecker3-ci:${PYTHON_VERSION} .
          docker push oci.atklab.cloud/enochecker3/enochecker3-ci:${PYTHON_VERSION}
        done
