[project]
name = "enochecker3"
version = "0.18.6"
authors = [
	{ name = "Louis Burda", email = "dev@sinitax.com" },
	{ name = "Lucas Druschke", email = "ldruschk@posteo.de" }
]
description = "Library for building EnoEngine-compatible async checkers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
	"fastapi>=0.128.0,<0.129.0",
	"gunicorn==24.1.1",
	"httpx>=0.28.0,<0.29.0",
	"pymongo>=4.0.0,<5.0.0",
	"opentelemetry-api>=1.39.1",
    "opentelemetry-exporter-otlp>=1.39.1",
    "opentelemetry-instrumentation-fastapi>=0.60b1",
	"opentelemetry-instrumentation-httpx>=0.60b1",
	"opentelemetry-instrumentation-pymongo>=0.60b1",
    "opentelemetry-sdk>=1.39.1",
	"uvicorn>=0.40.0,<0.41.0",
	"enochecker-core~=0.18.0"
]

[project.optional-dependencies]
testing = [
	"mongomock>=4.3.0,<5.0.0",
]

[dependency-groups]
dev = [
	"ruff>=0.12.10",
	"coverage>=7.10.5",
	"pytest>=8.4.1",
	"pytest-asyncio>=1.1.0",
	"mypy>=1.17.1",
	"ty>=0.0.75",
	"mongomock>=4.3.0,<5.0.0",
]

[tool.uv.sources]
enochecker-core = { git = "https://git.atklab.cloud/atklab/enochecker-core", rev = "v0.18.2" }

[tool.ruff.lint]
ignore = [
	"E731",
	"E722",
	# The library deliberately exposes Any at its edges: ChainDB values, the
	# runtime injector lookup, and the assert_* helpers are all type-agnostic.
	"ANN401",
	# typing.Self is 3.11+; returning the explicit class name is correct here and
	# not worth a typing_extensions runtime dependency.
	"PYI034",
]
extend-select = ["ANN", "PYI"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
"example.py" = ["ANN"]
"example_service.py" = ["ANN"]

[tool.mypy]
strict = true

# ty runs alongside mypy until it reaches 1.0. Each checker owns its own
# suppression namespace so a `# type: ignore[...]` mypy needs is never reported
# as unused by ty, and vice versa; ty-only waivers use `# ty: ignore[...]`.
[tool.ty.rules]
missing-type-argument = "error"
possibly-unresolved-reference = "warn"

[tool.ty.analysis]
respect-type-ignore-comments = false

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]
exclude = []

[tool.setuptools.package-data]
"enochecker3" = ["py.typed"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-s -rP --strict-markers"
testpaths = [
	"tests"
]

